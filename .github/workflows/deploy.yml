name: Deploy

# Publica el sitio en GitHub Pages (dominio propio andres-felipe-sanabria.uk)
# en cada push a main. También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no se cancela uno que ya está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check, test y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos (astro check)
        run: npm run check

      - name: Pruebas (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Índice de búsqueda (Pagefind)
        run: npm run pagefind

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
